<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 user-scalable=no">

  <title>QR受付テスト</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 32px;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: 30px auto;
      background: white;
    }

    #message {
      margin: 30px auto;
      padding: 20px;
      max-width: 600px;
      font-size: 28px;
      font-weight: bold;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>インフルエンザ予防接種受付</h1>

  <p>QRコードをカメラにかざしてください</p>

  <div id="reader"></div>

  <div id="message">
    読取待機中
  </div>

  <script>

    const message =
      document.getElementById("message");

    let processing = false;

    const scanner =
      new Html5Qrcode(
        "reader",
        {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        }
      );

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }

      processing = true;

      message.innerHTML =
        "✓ 読み取り成功<br><br>" +
        decodedText;

      setTimeout(() => {

        message.textContent =
          "QRコードをかざしてください";

        processing = false;

      }, 2000);
    }

    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      function(errorMessage) {
        // 読み取れない間のエラーは無視
      }

    ).catch(function(error) {

      message.textContent =
        "カメラを起動できませんでした";

      console.error(error);

    });

  </script>

</body>
</html>
