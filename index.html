<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             user-scalable=no"
  >

  <title>インフルエンザ予防接種受付</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px 18px;
    
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        sans-serif;
    
      text-align: center;
      background: #f4f5f7;
    
      min-height: 100vh;
      min-height: 100dvh;
    
      overflow: hidden;
    }
    
    
    h1 {
      margin: 4px 0 6px;
      font-size: clamp(22px, 3.5vh, 32px);
    }
    
    
    .instruction {
      font-size: clamp(17px, 2.5vh, 22px);
      margin: 6px 0 10px;
    }
    
    
    #reader {
      width: 100%;
      max-width: 650px;
    
      /*
        縦方向を使いすぎないよう制限
      */
      max-height: 62dvh;
    
      margin: 8px auto;
    
      background: #000;
    
      border-radius: 16px;
    
      overflow: hidden;
    }
    
    
    #reader video {
      transform: scaleX(-1) !important;
      -webkit-transform: scaleX(-1) !important;
    
      /*
        カメラ映像自体を見切れにくくする
      */
      max-height: 62dvh !important;
      object-fit: contain !important;
    }
    
    
    #message {
      width: 100%;
      max-width: 650px;
    
      min-height: 64px;
    
      margin: 10px auto 0;
    
      padding: 10px 16px;
    
      display: flex;
      justify-content: center;
      align-items: center;
    
      background: white;
    
      border-radius: 12px;
    
      font-size: clamp(20px, 3vh, 27px);
      font-weight: bold;
    }


    /* =========================
       受付結果 全画面表示
       ========================= */

    #resultOverlay {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px;

      text-align: center;

      color: white;

      pointer-events: none;
    }


    #resultOverlay.show {
      display: flex;
    }


    #resultOverlay.success {
      background: #188038;
    }


    #resultOverlay.duplicate {
      background: #d97706;
    }


    #resultOverlay.error {
      background: #c5221f;
    }


    #resultIcon {
      font-size: 100px;
      line-height: 1;
      margin-bottom: 25px;
    }


    #resultTitle {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 30px;
    }


    #resultName {
      font-size: 44px;
      font-weight: 700;
      margin-bottom: 20px;
    }


    #resultDetail {
      font-size: 26px;
    }


    /* =========================
       最初の受付開始画面
       ========================= */

    #startScreen {
      position: fixed;

      inset: 0;

      z-index: 10000;

      display: flex;

      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px;

      background: #f4f5f7;
    }


    #startScreen h2 {
      font-size: 38px;
      margin-bottom: 20px;
    }


    #startScreen p {
      font-size: 21px;
      line-height: 1.7;
      margin-bottom: 35px;
    }


    #startButton {
      min-width: 300px;

      padding: 22px 45px;

      border: none;
      border-radius: 14px;

      font-size: 30px;
      font-weight: bold;

      background: #1a73e8;
      color: white;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }


    #startButton:active {
      transform: scale(0.98);
    }


    @media (max-width: 700px) {

      h1 {
        font-size: 27px;
      }

      .instruction {
        font-size: 19px;
      }

      #resultTitle {
        font-size: 42px;
      }

      #resultName {
        font-size: 36px;
      }
    }
    
      #resultOverlay.reading {
        background: #1a73e8;
      }
    
  </style>

</head>


<body>


  <!-- =========================
       初回開始画面
       ========================= -->

  <div id="startScreen">

    <h2>
      インフルエンザ予防接種受付
    </h2>

    <p>
      「受付開始」を押すと<br>
      カメラを起動します。
    </p>

    <button id="startButton">
      受付開始
    </button>

  </div>



  <!-- =========================
       通常受付画面
       ========================= -->

  <h1>
    インフルエンザ予防接種受付
  </h1>

  <div class="instruction">
    QRコードを枠内にかざしてください
  </div>


  <div id="reader"></div>


  <div id="message">
    受付開始待ち
  </div>



  <!-- =========================
       全画面結果
       ========================= -->

  <div id="resultOverlay">

    <div id="resultIcon"></div>

    <div id="resultTitle"></div>

    <div id="resultName"></div>

    <div id="resultDetail"></div>

  </div>



  <!-- =========================
       GAS通信用
       ========================= -->

  <iframe
    name="gasFrame"
    id="gasFrame"
    style="display:none">
  </iframe>



<script>


  // ==================================================
  // 設定
  // ==================================================

  const GAS_WEB_APP_URL =
    'https://script.google.com/macros/s/AKfycbw52X7WKE0XZKYAnhAoT6SagJxCnKIPjTcA85dXWQ6VEPEtQp-ciWhiRKA2qwfcLRzV7A/exec';


  // 成功表示時間
  const SUCCESS_DISPLAY_TIME = 1400;

  // 受付済み表示時間
  const DUPLICATE_DISPLAY_TIME = 1900;

  // エラー表示時間
  const ERROR_DISPLAY_TIME = 2200;

  // 同一QRを再読取しない時間
  const SAME_QR_LOCK_TIME = 7000;



  // ==================================================
  // DOM
  // ==================================================

  const message =
    document.getElementById('message');

  const startScreen =
    document.getElementById('startScreen');

  const startButton =
    document.getElementById('startButton');

  const resultOverlay =
    document.getElementById('resultOverlay');

  const resultIcon =
    document.getElementById('resultIcon');

  const resultTitle =
    document.getElementById('resultTitle');

  const resultName =
    document.getElementById('resultName');

  const resultDetail =
    document.getElementById('resultDetail');



  // ==================================================
  // 状態管理
  // ==================================================

  let processing = false;

  let currentRequestId = null;

  let lastToken = '';

  let lastReadTime = 0;

  let scannerStarted = false;

  let audioContext = null;



  // ==================================================
  // QRスキャナー
  // ==================================================

  const scanner =
    new Html5Qrcode(
      'reader',
      {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      }
    );



  // ==================================================
  // 受付開始
  // ==================================================

  startButton.addEventListener(
    'click',
    async function () {

      startButton.disabled = true;

      startButton.textContent =
        '起動中…';


      /*
        iPad Safariの音声制限対策。

        ユーザーがボタンを押したタイミングで
        AudioContextを開始しておく。
      */
      try {

        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        audioContext =
          new AudioContextClass();

        if (
          audioContext.state === 'suspended'
        ) {

          await audioContext.resume();
        }

      } catch (error) {

        console.warn(
          '音声機能を開始できませんでした。',
          error
        );
      }


      try {

        await startScanner();

        startScreen.style.display =
          'none';

        message.textContent =
          'QRコードをかざしてください';

      } catch (error) {

        console.error(error);

        startButton.disabled = false;

        startButton.textContent =
          '再試行';

        alert(
          'カメラを起動できませんでした。\n' +
          'Safariのカメラ許可をご確認ください。'
        );
      }

    }
  );



  // ==================================================
  // カメラ開始
  // ==================================================

  async function startScanner() {

    if (scannerStarted) {
      return;
    }


    await scanner.start(

      /*
        前面カメラを優先
      */
      {
        facingMode: 'user'
      },


      /*
        QR読取設定
      */
      {

        fps: 12,


        /*
          iPadの画面サイズに合わせて
          読取枠を大きくする。

          短辺の約82%。
          最大430px。
        */
        qrbox: function (
          viewfinderWidth,
          viewfinderHeight
        ) {

          const shortSide =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );

          const size =
            Math.floor(
              Math.min(
                430,
                shortSide * 0.82
              )
            );

          return {
            width: size,
            height: size
          };
        }

      },


      onScanSuccess,


      function () {

        /*
          QRが映っていない時にも
          頻繁に呼ばれるため無視
        */

      }

    );


    scannerStarted = true;
  }



  // ==================================================
  // QR読取成功
  // ==================================================

  function onScanSuccess(
    decodedText
  ) {

    const token =
      String(
        decodedText || ''
      ).trim();


    if (!token) {
      return;
    }


    /*
      GAS処理中・結果表示中は
      次のQRを受け付けない
    */
    if (processing) {
      return;
    }


    /*
      同じQRをカメラ前に
      出し続けた場合の二重読取防止
    */
    const now =
      Date.now();


    if (
      token === lastToken &&
      now - lastReadTime
        < SAME_QR_LOCK_TIME
    ) {

      return;
    }


    lastToken =
      token;
    
    lastReadTime =
      now;
    
    
    /*
      QRコードを読み取った瞬間に
      短い音を鳴らす
    */
    playReadSound();
    
    
    /*
      「QRコードを離してください」
      を表示
    */
    showReadingResult();
    
    
    /*
      GASへ受付登録
    */
    submitReception(token);


    function showReadingResult() {
    
      resultOverlay.className =
        'show reading';
    
      resultIcon.textContent =
        '✓';
    
      resultTitle.textContent =
        '読み取りました';
    
      resultName.textContent =
        'QRコードを離してください';
    
      resultDetail.textContent =
        '受付処理中…';
    
    }
  // ==================================================
  // GASへ受付情報送信
  // ==================================================

  function submitReception(
    token
  ) {

    processing =
      true;


    currentRequestId =
      createRequestId();


    message.textContent =
      '受付処理中…';


    const form =
      document.createElement(
        'form'
      );


    form.method =
      'POST';


    form.action =
      GAS_WEB_APP_URL;


    form.target =
      'gasFrame';


    form.style.display =
      'none';


    addHiddenInput(
      form,
      'token',
      token
    );


    addHiddenInput(
      form,
      'requestId',
      currentRequestId
    );


    document.body.appendChild(
      form
    );


    form.submit();


    form.remove();



    const requestId =
      currentRequestId;



    /*
      GASから返事がない場合
    */
    setTimeout(
      function () {

        if (
          processing &&
          currentRequestId ===
            requestId
        ) {

          showResult(
            'error',
            '！',
            '通信エラー',
            '',
            'もう一度QRコードをかざしてください。',
            ERROR_DISPLAY_TIME
          );

        }

      },
      10000
    );

  }



  function addHiddenInput(
    form,
    name,
    value
  ) {

    const input =
      document.createElement(
        'input'
      );


    input.type =
      'hidden';


    input.name =
      name;


    input.value =
      value;


    form.appendChild(
      input
    );
  }



  // ==================================================
  // GASから受付結果を受信
  // ==================================================

  window.addEventListener(
    'message',
    function (event) {

      const data =
        event.data;


      if (
        !data ||
        data.source !==
          'flu-reception'
      ) {

        return;
      }


      if (
        data.requestId !==
          currentRequestId
      ) {

        return;
      }



      switch (
        data.status
      ) {


        // ------------------------------------------
        // 新規受付成功
        // ------------------------------------------

        case 'success':

          playSuccessSound();

          showResult(
            'success',
            '✓',
            '受付完了',
            data.name + ' さん',
            data.time || '',
            SUCCESS_DISPLAY_TIME
          );

          break;



        // ------------------------------------------
        // 受付済み
        // ------------------------------------------

        case 'duplicate':

          playWarningSound();

          showResult(
            'duplicate',
            '！',
            '受付済みです',
            data.name + ' さん',
            '受付時刻 ' +
              (data.time || ''),
            DUPLICATE_DISPLAY_TIME
          );

          break;



        // ------------------------------------------
        // 受付時間外
        // ------------------------------------------

        case 'closed':

          playErrorSound();

          showResult(
            'error',
            '×',
            '受付時間外です',
            '',
            '',
            ERROR_DISPLAY_TIME
          );

          break;



        // ------------------------------------------
        // 未登録QR
        // ------------------------------------------

        case 'invalid':

          playErrorSound();

          showResult(
            'error',
            '×',
            '受付できません',
            '',
            data.message ||
              '登録されていないQRコードです。',
            ERROR_DISPLAY_TIME
          );

          break;



        // ------------------------------------------
        // 混雑
        // ------------------------------------------

        case 'busy':

          playWarningSound();

          showResult(
            'duplicate',
            '！',
            '受付処理中です',
            '',
            'もう一度QRコードをかざしてください。',
            1500
          );

          break;



        // ------------------------------------------
        // その他エラー
        // ------------------------------------------

        default:

          playErrorSound();

          showResult(
            'error',
            '×',
            'エラー',
            '',
            '受付処理でエラーが発生しました。',
            ERROR_DISPLAY_TIME
          );

      }

    }
  );



  // ==================================================
  // 全画面結果表示
  // ==================================================

  function showResult(
    type,
    icon,
    title,
    name,
    detail,
    displayTime
  ) {

    /*
      結果表示中もprocessing=trueなので
      カメラは動いていても
      次の受付は開始されない
    */


    resultOverlay.className =
      'show ' + type;


    resultIcon.textContent =
      icon;


    resultTitle.textContent =
      title;


    resultName.textContent =
      name || '';


    resultDetail.textContent =
      detail || '';


    message.textContent =
      title;



    setTimeout(
      function () {

        resultOverlay.className =
          '';


        resultIcon.textContent =
          '';


        resultTitle.textContent =
          '';


        resultName.textContent =
          '';


        resultDetail.textContent =
          '';


        processing =
          false;


        currentRequestId =
          null;


        message.textContent =
          'QRコードをかざしてください';

      },
      displayTime
    );

  }



  // ==================================================
  // 音声
  // ==================================================

  function playTone(
    frequency,
    duration,
    volume = 0.18
  ) {

    if (!audioContext) {
      return;
    }


    try {

      const oscillator =
        audioContext.createOscillator();


      const gain =
        audioContext.createGain();


      const now =
        audioContext.currentTime;


      oscillator.type =
        'sine';


      oscillator.frequency
        .setValueAtTime(
          frequency,
          now
        );


      /*
        音の頭と終わりを滑らかにして
        「ブツッ」というノイズを防ぐ
      */
      gain.gain
        .setValueAtTime(
          0.0001,
          now
        );


      gain.gain
        .exponentialRampToValueAtTime(
          volume,
          now + 0.01
        );


      gain.gain
        .exponentialRampToValueAtTime(
          0.0001,
          now + duration
        );


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.start(
        now
      );


      oscillator.stop(
        now +
        duration +
        0.02
      );

    } catch (error) {

      console.warn(
        '音声再生エラー',
        error
      );
    }

  }



  /*
    受付成功

    高めの2音
  */
  function playSuccessSound() {

    playTone(
      880,
      0.10
    );


    setTimeout(
      function () {

        playTone(
          1175,
          0.16
        );

      },
      100
    );

  }



  /*
    受付済み
  */
  function playWarningSound() {

    playTone(
      650,
      0.16
    );

  }



  /*
    エラー
  */
  function playErrorSound() {

    playTone(
      330,
      0.20
    );


    setTimeout(
      function () {

        playTone(
          280,
          0.20
        );

      },
      180
    );

  }
    
  /*
    読み取り
  */
function playReadSound() {

  playTone(
    900,
    0.10
  );

}

  // ==================================================
  // 共通処理
  // ==================================================

  function createRequestId() {

    if (
      window.crypto &&
      crypto.randomUUID
    ) {

      return crypto.randomUUID();
    }


    return (
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .substring(2)
    );

  }

</script>


</body>

</html>
