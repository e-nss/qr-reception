<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             user-scalable=no"
  >

  <title>インフルエンザ予防接種受付</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px 18px;
    
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        sans-serif;
    
      text-align: center;
      background: #f4f5f7;
    
      min-height: 100vh;
      min-height: 100dvh;
    
      overflow: hidden;
    }
    
    
    h1 {
      margin: 4px 0 6px;
      font-size: clamp(22px, 3.5vh, 32px);
    }
    
    
    .instruction {
      font-size: clamp(17px, 2.5vh, 22px);
      margin: 6px 0 10px;
    }
    
    
    #reader {
      width: 100%;
      max-width: 650px;
    
      /*
        縦方向を使いすぎないよう制限
      */
      max-height: 62dvh;
    
      margin: 8px auto;
    
      background: #000;
    
      border-radius: 16px;
    
      overflow: hidden;
    }
    
    
    #reader video {
      transform: scaleX(-1) !important;
      -webkit-transform: scaleX(-1) !important;
    
      /*
        カメラ映像自体を見切れにくくする
      */
      max-height: 62dvh !important;
      object-fit: contain !important;
    }
    
    
    #message {
      width: 100%;
      max-width: 650px;
    
      min-height: 64px;
    
      margin: 10px auto 0;
    
      padding: 10px 16px;
    
      display: flex;
      justify-content: center;
      align-items: center;
    
      background: white;
    
      border-radius: 12px;
    
      font-size: clamp(20px, 3vh, 27px);
      font-weight: bold;
    }


    /* =========================
       受付結果 全画面表示
       ========================= */

    #resultOverlay {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px;

      text-align: center;

      color: white;

      pointer-events: none;
    }


    #resultOverlay.show {
      display: flex;
    }


    #resultOverlay.success {
      background: #188038;
    }


    #resultOverlay.duplicate {
      background: #d97706;
    }


    #resultOverlay.error {
      background: #c5221f;
    }


    #resultIcon {
      font-size: 100px;
      line-height: 1;
      margin-bottom: 25px;
    }


    #resultTitle {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 30px;
    }


    #resultName {
      font-size: 44px;
      font-weight: 700;
      margin-bottom: 20px;
    }


    #resultDetail {
      font-size: 26px;
    }


    /* =========================
       最初の受付開始画面
       ========================= */

    #startScreen {
      position: fixed;

      inset: 0;

      z-index: 10000;

      display: flex;

      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px;

      background: #f4f5f7;
    }


    #startScreen h2 {
      font-size: 38px;
      margin-bottom: 20px;
    }


    #startScreen p {
      font-size: 21px;
      line-height: 1.7;
      margin-bottom: 35px;
    }


    #startButton {
      min-width: 300px;

      padding: 22px 45px;

      border: none;
      border-radius: 14px;

      font-size: 30px;
      font-weight: bold;

      background: #1a73e8;
      color: white;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }


    #startButton:active {
      transform: scale(0.98);
    }


    @media (max-width: 700px) {

      h1 {
        font-size: 27px;
      }

      .instruction {
        font-size: 19px;
      }

      #resultTitle {
        font-size: 42px;
      }

      #resultName {
        font-size: 36px;
      }
    }
    
      #resultOverlay.reading {
        background: #1a73e8;
      }
 /* =========================
   社員番号受付ボタン
   ========================= */

#manualReceptionButton {
  position: fixed;

  right: 18px;
  bottom: 18px;

  z-index: 200;

  padding: 13px 20px;

  border: none;
  border-radius: 10px;

  background: #5f6368;
  color: white;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}


#manualReceptionButton:active {
  transform: scale(0.98);
}


/* =========================
   社員番号受付 全画面
   ========================= */

#manualReceptionOverlay {
  position: fixed;

  inset: 0;

  z-index: 9000;

  display: none;

  justify-content: center;
  align-items: center;

  padding: 30px;

  background: rgba(
    244,
    245,
    247,
    0.98
  );
}


#manualReceptionOverlay.show {
  display: flex;
}


.manual-card {
  width: 100%;
  max-width: 560px;

  padding: 35px;

  background: white;

  border-radius: 18px;

  box-shadow:
    0 4px 24px
    rgba(0, 0, 0, 0.15);
}


.manual-card h2 {
  margin:
    0 0 25px;

  font-size: 32px;
}


.manual-card p {
  font-size: 20px;
}


#employeeNoInput {
  width: 100%;

  padding: 16px;

  border:
    2px solid #dadce0;

  border-radius: 10px;

  font-size: 34px;

  text-align: center;
}


#employeeNoInput:focus {
  outline: none;

  border-color:
    #1a73e8;
}


#manualMessage {
  min-height: 32px;

  margin-top: 12px;

  color: #c5221f;

  font-size: 18px;
  font-weight: bold;
}


.manual-buttons {
  display: flex;

  gap: 14px;

  margin-top: 25px;
}


.manual-button {
  flex: 1;

  padding: 17px;

  border: none;
  border-radius: 10px;

  font-size: 21px;
  font-weight: bold;

  cursor: pointer;
}


.manual-button.primary {
  background:
    #1a73e8;

  color:
    white;
}


.manual-button.secondary {
  background:
    #e8eaed;

  color:
    #202124;
}


.employee-confirm {
  padding: 22px;

  background:
    #f1f3f4;

  border-radius: 12px;

  font-size: 21px;

  line-height: 1.8;
}


.confirm-name {
  margin-bottom: 8px;

  font-size: 32px;
  font-weight: bold;
}


.confirm-question {
  margin-top: 25px;

  font-weight: bold;
}   
  </style>

</head>


<body>


  <!-- =========================
       初回開始画面
       ========================= -->

  <div id="startScreen">

    <h2>
      インフルエンザ予防接種受付
    </h2>

    <p>
      「受付開始」を押すと<br>
      カメラを起動します。
    </p>

    <button id="startButton">
      受付開始
    </button>

  </div>



  <!-- =========================
       通常受付画面
       ========================= -->

  <h1>
    インフルエンザ予防接種受付
  </h1>

  <div class="instruction">
    QRコードを枠内にかざしてください
  </div>


  <div id="reader"></div>


  <div id="message">
    受付開始待ち
  </div>

<!-- =========================
     社員番号受付
     ========================= -->

<button
  id="manualReceptionButton"
  type="button">
  社員番号で受付
</button>


<div id="manualReceptionOverlay">

  <div class="manual-card">

    <h2>
      社員番号で受付
    </h2>


    <!-- 入力画面 -->
    <div id="manualInputStep">

      <p>
        社員番号を入力してください
      </p>

      <input
        id="employeeNoInput"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="社員番号"
      >


      <div
        id="manualMessage">
      </div>


      <div class="manual-buttons">

        <button
          id="manualCancelButton"
          type="button"
          class="manual-button secondary">
          戻る
        </button>

        <button
          id="employeeSearchButton"
          type="button"
          class="manual-button primary">
          検索
        </button>

      </div>

    </div>


    <!-- 確認画面 -->
    <div
      id="manualConfirmStep"
      style="display:none;">

      <div class="employee-confirm">

        <div
          id="confirmName"
          class="confirm-name">
        </div>

        <div
          id="confirmDepartment">
        </div>

        <div
          id="confirmEmployeeNo">
        </div>

        <div
          id="confirmTimeSlot">
        </div>

      </div>


      <p class="confirm-question">
        この社員を受付しますか？
      </p>


      <div class="manual-buttons">

        <button
          id="manualBackButton"
          type="button"
          class="manual-button secondary">
          戻る
        </button>

        <button
          id="manualRegisterButton"
          type="button"
          class="manual-button primary">
          受付する
        </button>

      </div>

    </div>

  </div>

</div>

  <!-- =========================
       全画面結果
       ========================= -->

  <div id="resultOverlay">

    <div id="resultIcon"></div>

    <div id="resultTitle"></div>

    <div id="resultName"></div>

    <div id="resultDetail"></div>

  </div>



  <!-- =========================
       GAS通信用
       ========================= -->

  <iframe
    name="gasFrame"
    id="gasFrame"
    style="display:none">
  </iframe>



<script>


  // ==================================================
  // 設定
  // ==================================================

  const GAS_WEB_APP_URL =
    'https://script.google.com/macros/s/AKfycbw52X7WKE0XZKYAnhAoT6SagJxCnKIPjTcA85dXWQ6VEPEtQp-ciWhiRKA2qwfcLRzV7A/exec';


  // 成功表示時間
  const SUCCESS_DISPLAY_TIME = 1400;

  // 受付済み表示時間
  const DUPLICATE_DISPLAY_TIME = 1900;

  // エラー表示時間
  const ERROR_DISPLAY_TIME = 2200;

  // 同一QRを再読取しない時間
  const SAME_QR_LOCK_TIME = 7000;



  // ==================================================
  // DOM
  // ==================================================

  const message =
    document.getElementById('message');

  const startScreen =
    document.getElementById('startScreen');

  const startButton =
    document.getElementById('startButton');

  const resultOverlay =
    document.getElementById('resultOverlay');

  const resultIcon =
    document.getElementById('resultIcon');

  const resultTitle =
    document.getElementById('resultTitle');

  const resultName =
    document.getElementById('resultName');

  const resultDetail =
    document.getElementById('resultDetail');

const manualReceptionButton =
  document.getElementById(
    'manualReceptionButton'
  );

const manualReceptionOverlay =
  document.getElementById(
    'manualReceptionOverlay'
  );

const manualInputStep =
  document.getElementById(
    'manualInputStep'
  );

const manualConfirmStep =
  document.getElementById(
    'manualConfirmStep'
  );

const employeeNoInput =
  document.getElementById(
    'employeeNoInput'
  );

const employeeSearchButton =
  document.getElementById(
    'employeeSearchButton'
  );

const manualCancelButton =
  document.getElementById(
    'manualCancelButton'
  );

const manualBackButton =
  document.getElementById(
    'manualBackButton'
  );

const manualRegisterButton =
  document.getElementById(
    'manualRegisterButton'
  );

const manualMessage =
  document.getElementById(
    'manualMessage'
  );

const confirmName =
  document.getElementById(
    'confirmName'
  );

const confirmDepartment =
  document.getElementById(
    'confirmDepartment'
  );

const confirmEmployeeNo =
  document.getElementById(
    'confirmEmployeeNo'
  );

const confirmTimeSlot =
  document.getElementById(
    'confirmTimeSlot'
  );

  // ==================================================
  // 状態管理
  // ==================================================

  let processing = false;

  let currentRequestId = null;

  let lastToken = '';

  let lastReadTime = 0;

  let scannerStarted = false;

  let audioContext = null;

  let currentAction = null;
  
  let selectedEmployeeNo = '';

  // ==================================================
  // QRスキャナー
  // ==================================================

  const scanner =
    new Html5Qrcode(
      'reader',
      {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      }
    );



  // ==================================================
  // 受付開始
  // ==================================================

  startButton.addEventListener(
    'click',
    async function () {

      startButton.disabled = true;

      startButton.textContent =
        '起動中…';


      /*
        iPad Safariの音声制限対策。

        ユーザーがボタンを押したタイミングで
        AudioContextを開始しておく。
      */
      try {

        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        audioContext =
          new AudioContextClass();

        if (
          audioContext.state === 'suspended'
        ) {

          await audioContext.resume();
        }

      } catch (error) {

        console.warn(
          '音声機能を開始できませんでした。',
          error
        );
      }


      try {

        await startScanner();

      // ==================================================
// 社員番号受付を開く
// ==================================================

manualReceptionButton.addEventListener(
  'click',
  function () {

    if (processing) {
      return;
    }


    processing =
      true;


    selectedEmployeeNo =
      '';


    employeeNoInput.value =
      '';


    manualMessage.textContent =
      '';


    manualInputStep.style.display =
      'block';


    manualConfirmStep.style.display =
      'none';


    manualReceptionOverlay.classList.add(
      'show'
    );


    setTimeout(
      function () {

        employeeNoInput.focus();

      },
      100
    );

  }
);


// ==================================================
// キャンセル
// ==================================================

manualCancelButton.addEventListener(
  'click',
  closeManualReception
);


function closeManualReception() {

  manualReceptionOverlay.classList.remove(
    'show'
  );


  selectedEmployeeNo =
    '';


  currentRequestId =
    null;


  currentAction =
    null;


  processing =
    false;


  message.textContent =
    'QRコードをかざしてください';

}


// ==================================================
// 社員番号検索
// ==================================================

employeeSearchButton.addEventListener(
  'click',
  searchEmployee
);


employeeNoInput.addEventListener(
  'keydown',
  function (event) {

    if (
      event.key === 'Enter'
    ) {

      event.preventDefault();

      searchEmployee();

    }

  }
);


function searchEmployee() {

  const employeeNo =
    String(
      employeeNoInput.value || ''
    ).trim();


  if (!employeeNo) {

    manualMessage.textContent =
      '社員番号を入力してください。';

    return;

  }


  manualMessage.textContent =
    '検索中…';


  employeeSearchButton.disabled =
    true;


  sendGasRequest(
    'lookupEmployee',
    {
      employeeNo:
        employeeNo
    }
  );

}


// ==================================================
// 確認画面から戻る
// ==================================================

manualBackButton.addEventListener(
  'click',
  function () {

    selectedEmployeeNo =
      '';


    manualConfirmStep.style.display =
      'none';


    manualInputStep.style.display =
      'block';


    manualMessage.textContent =
      '';


    employeeNoInput.focus();

  }
);


// ==================================================
// 社員番号受付確定
// ==================================================

manualRegisterButton.addEventListener(
  'click',
  function () {

    if (!selectedEmployeeNo) {
      return;
    }


    manualRegisterButton.disabled =
      true;


    sendGasRequest(
      'registerEmployee',
      {
        employeeNo:
          selectedEmployeeNo
      }
    );

  }
);

        startScreen.style.display =
          'none';

        message.textContent =
          'QRコードをかざしてください';

      } catch (error) {

        console.error(error);

        startButton.disabled = false;

        startButton.textContent =
          '再試行';

        alert(
          'カメラを起動できませんでした。\n' +
          'Safariのカメラ許可をご確認ください。'
        );
      }

    }
  );



  // ==================================================
  // カメラ開始
  // ==================================================

  async function startScanner() {

    if (scannerStarted) {
      return;
    }


    await scanner.start(

      /*
        前面カメラを優先
      */
      {
        facingMode: 'user'
      },


      /*
        QR読取設定
      */
      {

        fps: 12,


        /*
          iPadの画面サイズに合わせて
          読取枠を大きくする。

          短辺の約82%。
          最大430px。
        */
        qrbox: function (
          viewfinderWidth,
          viewfinderHeight
        ) {

          const shortSide =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            );

          const size =
            Math.floor(
              Math.min(
                430,
                shortSide * 0.82
              )
            );

          return {
            width: size,
            height: size
          };
        }

      },


      onScanSuccess,


      function () {

        /*
          QRが映っていない時にも
          頻繁に呼ばれるため無視
        */

      }

    );


    scannerStarted = true;
  }



  // ==================================================
  // QR読取成功
  // ==================================================

  function onScanSuccess(
    decodedText
  ) {

    const token =
      String(
        decodedText || ''
      ).trim();


    if (!token) {
      return;
    }


    /*
      GAS処理中・結果表示中は
      次のQRを受け付けない
    */
    if (processing) {
      return;
    }


    /*
      同じQRをカメラ前に
      出し続けた場合の二重読取防止
    */
    const now =
      Date.now();


    if (
      token === lastToken &&
      now - lastReadTime
        < SAME_QR_LOCK_TIME
    ) {

      return;
    }


    lastToken =
      token;

    lastReadTime =
      now;


    /*
      QRコードを読み取った瞬間に
      短い音を鳴らす
    */
    playReadSound();


    /*
      「QRコードを離してください」
      を表示
    */
    showReadingResult();


    /*
      GASへ受付登録
    */
    submitReception(token);

  } 



  function showReadingResult() {

    resultOverlay.className =
      'show reading';

    resultIcon.textContent =
      '✓';

    resultTitle.textContent =
      '読み取りました';

    resultName.textContent =
      'QRコードを離してください';

    resultDetail.textContent =
      '受付処理中…';

  }
  
  // ==================================================
  // GASへ受付情報送信
  // ==================================================

// ==================================================
// QR受付送信
// ==================================================

function submitReception(
  token
) {

  processing =
    true;


  message.textContent =
    '受付処理中…';


  sendGasRequest(
    'qr',
    {
      token:
        token
    }
  );

}


// ==================================================
// GAS共通送信
// ==================================================

function sendGasRequest(
  action,
  parameters
) {

  currentRequestId =
    createRequestId();


  currentAction =
    action;


  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    GAS_WEB_APP_URL;


  form.target =
    'gasFrame';


  form.style.display =
    'none';


  addHiddenInput(
    form,
    'action',
    action
  );


  addHiddenInput(
    form,
    'requestId',
    currentRequestId
  );


  Object.keys(
    parameters
  ).forEach(
    function (key) {

      addHiddenInput(
        form,
        key,
        parameters[key]
      );

    }
  );


  document.body.appendChild(
    form
  );


  form.submit();


  form.remove();


  const requestId =
    currentRequestId;


  // ------------------------------------------
  // タイムアウト
  // ------------------------------------------

  setTimeout(
    function () {

      if (
        currentRequestId !==
        requestId
      ) {

        return;

      }


      // 社員番号画面
      if (
        currentAction ===
          'lookupEmployee' ||
        currentAction ===
          'registerEmployee'
      ) {

        manualMessage.textContent =
          '通信エラーが発生しました。もう一度お試しください。';


        employeeSearchButton.disabled =
          false;

        manualRegisterButton.disabled =
          false;


        currentRequestId =
          null;


        currentAction =
          null;


        return;

      }


      // QR受付
      showResult(
        'error',
        '！',
        '通信エラー',
        '',
        'もう一度QRコードをかざしてください。',
        ERROR_DISPLAY_TIME
      );


    },
    10000
  );

}



  function addHiddenInput(
    form,
    name,
    value
  ) {

    const input =
      document.createElement(
        'input'
      );


    input.type =
      'hidden';


    input.name =
      name;


    input.value =
      value;


    form.appendChild(
      input
    );
  }



// ==================================================
// GASから結果受信
// ==================================================

window.addEventListener(
  'message',
  function (event) {

    const data =
      event.data;


    if (
      !data ||
      data.source !==
        'flu-reception'
    ) {

      return;

    }


    if (
      data.requestId !==
        currentRequestId
    ) {

      return;

    }


    const action =
      data.action ||
      currentAction ||
      'qr';


    // ==================================================
    // 社員番号検索結果
    // ==================================================

    if (
      action ===
        'lookupEmployee'
    ) {

      employeeSearchButton.disabled =
        false;


      currentRequestId =
        null;


      currentAction =
        null;


      // ------------------------------------------
      // 見つかった
      // ------------------------------------------

      if (
        data.status ===
          'found'
      ) {

        selectedEmployeeNo =
          data.employeeNo;


        confirmName.textContent =
          data.name +
          ' さん';


        confirmDepartment.textContent =
          '所属：' +
          (
            data.department ||
            '―'
          );


        confirmEmployeeNo.textContent =
          '社員番号：' +
          data.employeeNo;


        confirmTimeSlot.textContent =
          '受付時間帯：' +
          (
            data.timeSlot ||
            '―'
          );


        manualInputStep.style.display =
          'none';


        manualConfirmStep.style.display =
          'block';


        return;

      }


      // ------------------------------------------
      // すでに受付済み
      // ------------------------------------------

      if (
        data.status ===
          'duplicate'
      ) {

        manualReceptionOverlay
          .classList.remove(
            'show'
          );


        playWarningSound();


        showResult(
          'duplicate',
          '！',
          '受付済みです',
          data.name + ' さん',
          '受付時刻 ' +
            (data.time || ''),
          DUPLICATE_DISPLAY_TIME
        );


        return;

      }


      // ------------------------------------------
      // 時間外
      // ------------------------------------------

      if (
        data.status ===
          'closed'
      ) {

        manualReceptionOverlay
          .classList.remove(
            'show'
          );


        playErrorSound();


        showResult(
          'error',
          '×',
          '受付時間外です',
          '',
          '',
          ERROR_DISPLAY_TIME
        );


        return;

      }


      // ------------------------------------------
      // 見つからない等
      // ------------------------------------------

      manualMessage.textContent =
        data.message ||
        '該当する社員が見つかりません。';


      return;

    }


    // ==================================================
    // 社員番号受付確定結果
    // ==================================================

    if (
      action ===
        'registerEmployee'
    ) {

      manualRegisterButton.disabled =
        false;


      // ------------------------------------------
      // 成功
      // ------------------------------------------

      if (
        data.status ===
          'success'
      ) {

        manualReceptionOverlay
          .classList.remove(
            'show'
          );


        playSuccessSound();


        showResult(
          'success',
          '✓',
          '受付完了',
          data.name + ' さん',
          data.time || '',
          SUCCESS_DISPLAY_TIME
        );


        return;

      }


      // ------------------------------------------
      // 二重受付
      // ------------------------------------------

      if (
        data.status ===
          'duplicate'
      ) {

        manualReceptionOverlay
          .classList.remove(
            'show'
          );


        playWarningSound();


        showResult(
          'duplicate',
          '！',
          '受付済みです',
          data.name + ' さん',
          '受付時刻 ' +
            (data.time || ''),
          DUPLICATE_DISPLAY_TIME
        );


        return;

      }


      // ------------------------------------------
      // その他
      // ------------------------------------------

      currentRequestId =
        null;

      currentAction =
        null;


      manualMessage.textContent =
        data.message ||
        '受付できませんでした。';


      return;

    }


    // ==================================================
    // 以下、通常QR受付
    // ==================================================

    switch (
      data.status
    ) {


      case 'success':

        playSuccessSound();

        showResult(
          'success',
          '✓',
          '受付完了',
          data.name + ' さん',
          data.time || '',
          SUCCESS_DISPLAY_TIME
        );

        break;


      case 'duplicate':

        playWarningSound();

        showResult(
          'duplicate',
          '！',
          '受付済みです',
          data.name + ' さん',
          '受付時刻 ' +
            (data.time || ''),
          DUPLICATE_DISPLAY_TIME
        );

        break;


      case 'closed':

        playErrorSound();

        showResult(
          'error',
          '×',
          '受付時間外です',
          '',
          '',
          ERROR_DISPLAY_TIME
        );

        break;


      case 'invalid':

        playErrorSound();

        showResult(
          'error',
          '×',
          '受付できません',
          '',
          data.message ||
            '登録されていないQRコードです。',
          ERROR_DISPLAY_TIME
        );

        break;


      case 'busy':

        playWarningSound();

        showResult(
          'duplicate',
          '！',
          '受付処理中です',
          '',
          'もう一度お試しください。',
          1500
        );

        break;


      default:

        playErrorSound();

        showResult(
          'error',
          '×',
          'エラー',
          '',
          data.message ||
            '受付処理でエラーが発生しました。',
          ERROR_DISPLAY_TIME
        );

    }

  }
);



  // ==================================================
  // 全画面結果表示
  // ==================================================

  function showResult(
    type,
    icon,
    title,
    name,
    detail,
    displayTime
  ) {

    /*
      結果表示中もprocessing=trueなので
      カメラは動いていても
      次の受付は開始されない
    */


    resultOverlay.className =
      'show ' + type;


    resultIcon.textContent =
      icon;


    resultTitle.textContent =
      title;


    resultName.textContent =
      name || '';


    resultDetail.textContent =
      detail || '';


    message.textContent =
      title;



    setTimeout(
      function () {

        resultOverlay.className =
          '';


        resultIcon.textContent =
          '';


        resultTitle.textContent =
          '';


        resultName.textContent =
          '';


        resultDetail.textContent =
          '';


        processing =
          false;


        currentRequestId =
          null;


        message.textContent =
          'QRコードをかざしてください';

      },
      displayTime
    );

  }



  // ==================================================
  // 音声
  // ==================================================

  function playTone(
    frequency,
    duration,
    volume = 0.18
  ) {

    if (!audioContext) {
      return;
    }


    try {

      const oscillator =
        audioContext.createOscillator();


      const gain =
        audioContext.createGain();


      const now =
        audioContext.currentTime;


      oscillator.type =
        'sine';


      oscillator.frequency
        .setValueAtTime(
          frequency,
          now
        );


      /*
        音の頭と終わりを滑らかにして
        「ブツッ」というノイズを防ぐ
      */
      gain.gain
        .setValueAtTime(
          0.0001,
          now
        );


      gain.gain
        .exponentialRampToValueAtTime(
          volume,
          now + 0.01
        );


      gain.gain
        .exponentialRampToValueAtTime(
          0.0001,
          now + duration
        );


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.start(
        now
      );


      oscillator.stop(
        now +
        duration +
        0.02
      );

    } catch (error) {

      console.warn(
        '音声再生エラー',
        error
      );
    }

  }



  /*
    受付成功

    高めの2音
  */
  function playSuccessSound() {

    playTone(
      880,
      0.10
    );


    setTimeout(
      function () {

        playTone(
          1175,
          0.16
        );

      },
      100
    );

  }



  /*
    受付済み
  */
  function playWarningSound() {

    playTone(
      650,
      0.16
    );

  }



  /*
    エラー
  */
  function playErrorSound() {

    playTone(
      330,
      0.20
    );


    setTimeout(
      function () {

        playTone(
          280,
          0.20
        );

      },
      180
    );

  }
    
  /*
    読み取り
  */
function playReadSound() {

  playTone(
    1300,
    0.07
  );

}

  // ==================================================
  // 共通処理
  // ==================================================

  function createRequestId() {

    if (
      window.crypto &&
      crypto.randomUUID
    ) {

      return crypto.randomUUID();
    }


    return (
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .substring(2)
    );

  }

</script>
